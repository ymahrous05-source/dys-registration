<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم المسجلين - سند شباب الدلتا</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --dys-bg-1: #0a2417;
      --dys-bg-2: #164028;
      --dys-green: #3cb44a;
      --dys-green-dark: #2b8d38;
      --dys-gold: #f5ab1e;
      --dys-white: #ffffff;
      --dys-text: #16321f;
      --dys-text-muted: #6d8177;
      --dys-error: #c0392b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Cairo', sans-serif;
      min-height: 100vh;
      background: linear-gradient(160deg, var(--dys-bg-2) 0%, var(--dys-bg-1) 65%);
      color: var(--dys-text);
      padding: 24px 16px 60px;
    }

    .wrap {
      max-width: 1180px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 22px;
      color: #fff;
    }

    header h1 {
      margin: 0 0 4px;
      font-size: 22px;
      font-weight: 800;
    }

    header p {
      margin: 0;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
    }

    /* ---------- Login gate ---------- */
    .gate {
      max-width: 380px;
      margin: 60px auto 0;
      background: #fff;
      border-radius: 22px;
      padding: 32px 26px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .gate h2 {
      margin: 0 0 6px;
      font-size: 18px;
    }

    .gate p {
      margin: 0 0 18px;
      font-size: 13px;
      color: var(--dys-text-muted);
    }

    .gate input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1.5px solid #e2e6e3;
      font-family: 'Cairo', sans-serif;
      font-size: 15px;
      margin-bottom: 12px;
      text-align: center;
    }

    .gate button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: var(--dys-green);
      color: #fff;
      font-family: 'Cairo', sans-serif;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    .gate .err {
      color: var(--dys-error);
      font-size: 12.5px;
      margin-top: 10px;
      display: none;
    }

    .gate .err.show {
      display: block;
    }

    /* ---------- Dashboard ---------- */
    #dashboard {
      display: none;
    }

    #dashboard.show {
      display: block;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: #fff;
      border-radius: 16px;
      padding: 16px 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    }

    .stat-card .num {
      font-size: 26px;
      font-weight: 800;
      color: var(--dys-green-dark);
    }

    .stat-card .label {
      font-size: 12px;
      color: var(--dys-text-muted);
      margin-top: 2px;
    }

    .toolbar {
      background: #fff;
      border-radius: 16px;
      padding: 16px 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .toolbar input,
    .toolbar select {
      padding: 9px 12px;
      border-radius: 10px;
      border: 1.5px solid #e2e6e3;
      font-family: 'Cairo', sans-serif;
      font-size: 13px;
    }

    .toolbar input[type="text"] {
      flex: 1;
      min-width: 180px;
    }

    .toolbar button {
      padding: 9px 16px;
      border: none;
      border-radius: 10px;
      font-family: 'Cairo', sans-serif;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    #exportBtn {
      background: var(--dys-gold);
      color: #4a3200;
    }

    #refreshBtn {
      background: #eef1ef;
      color: var(--dys-text);
    }

    .table-card {
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    }

    .table-scroll {
      overflow-x: auto;
      max-height: 70vh;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      white-space: nowrap;
    }

    thead th {
      position: sticky;
      top: 0;
      background: var(--dys-bg-2);
      color: #fff;
      padding: 12px 14px;
      text-align: right;
      font-weight: 700;
    }

    tbody td {
      padding: 10px 14px;
      border-bottom: 1px solid #f0f2f0;
    }

    tbody tr:hover {
      background: #f7faf7;
    }

    tbody tr:nth-child(even) {
      background: #fbfcfb;
    }

    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: var(--dys-text-muted);
    }

    .loading {
      text-align: center;
      padding: 50px 20px;
      color: #fff;
    }

    .error-banner {
      background: #fdecea;
      color: var(--dys-error);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 16px;
      font-size: 13px;
      font-weight: 600;
      display: none;
    }

    .error-banner.show {
      display: block;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <h1>لوحة تحكم المسجلين</h1>
      <p>Delta Youth Sanad &middot; سند شباب الدلتا</p>
    </header>

    <div class="gate" id="gate">
      <h2>دخول الأدمن</h2>
      <p>ادخل كلمة السر عشان تشوف بيانات المسجلين</p>
      <input type="password" id="passwordInput" placeholder="كلمة السر">
      <button type="button" id="loginBtn">دخول</button>
      <div class="err" id="loginErr">كلمة السر غلط، أو حصل خطأ في الاتصال.</div>
    </div>

    <div id="dashboard">
      <div class="error-banner" id="dashError"></div>

      <div class="stats-row" id="statsRow"></div>

      <div class="toolbar">
        <input type="text" id="searchInput" placeholder="بحث بالاسم أو الرقم القومي أو الإيميل...">
        <select id="roleFilter">
          <option value="">كل الصفات داخل الكيان</option>
        </select>
        <select id="facultyFilter">
          <option value="">كل الكليات</option>
        </select>
        <button type="button" id="refreshBtn">تحديث</button>
        <button type="button" id="exportBtn">تصدير Excel (CSV)</button>
      </div>

      <div class="table-card">
        <div class="table-scroll">
          <table id="dataTable">
            <thead>
              <tr id="tableHead"></tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
        <div class="empty-state" id="emptyState" style="display:none;">مفيش بيانات تطابق البحث</div>
        <div class="loading" id="loadingState" style="display:none;">جاري التحميل...</div>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxt81ok2pNBC28rnoHRI9f-DnreKp8yf8S-HzvFgWcXemIxKpok_Et6BKavZoNa26Y6/exec";

    let allHeaders = [];
    let allRows = [];
    let currentPassword = "";

    const gate = document.getElementById("gate");
    const dashboard = document.getElementById("dashboard");
    const loginBtn = document.getElementById("loginBtn");
    const passwordInput = document.getElementById("passwordInput");
    const loginErr = document.getElementById("loginErr");
    const dashError = document.getElementById("dashError");
    const loadingState = document.getElementById("loadingState");
    const emptyState = document.getElementById("emptyState");
    const tableHead = document.getElementById("tableHead");
    const tableBody = document.getElementById("tableBody");
    const statsRow = document.getElementById("statsRow");
    const searchInput = document.getElementById("searchInput");
    const roleFilter = document.getElementById("roleFilter");
    const facultyFilter = document.getElementById("facultyFilter");

    function fetchData(password) {
      loadingState.style.display = "block";
      dashError.classList.remove("show");
      const url = `${SCRIPT_URL}?action=list&password=${encodeURIComponent(password)}`;
      return fetch(url)
        .then(r => r.json())
        .then(res => {
          loadingState.style.display = "none";
          if (res.status !== "success") {
            throw new Error(res.message || "Unauthorized");
          }
          allHeaders = res.headers;
          allRows = res.rows;
          return true;
        });
    }

    loginBtn.addEventListener("click", () => {
      const pwd = passwordInput.value.trim();
      if (!pwd) return;
      loginBtn.disabled = true;
      loginBtn.textContent = "جاري التحقق...";
      fetchData(pwd)
        .then(() => {
          currentPassword = pwd;
          gate.style.display = "none";
          dashboard.classList.add("show");
          populateFilters();
          renderAll();
        })
        .catch(() => {
          loginErr.classList.add("show");
        })
        .finally(() => {
          loginBtn.disabled = false;
          loginBtn.textContent = "دخول";
        });
    });

    passwordInput.addEventListener("keydown", e => {
      if (e.key === "Enter") loginBtn.click();
    });

    document.getElementById("refreshBtn").addEventListener("click", () => {
      if (!currentPassword) return;
      fetchData(currentPassword).then(() => { populateFilters(); renderAll(); });
    });

    function colIndex(name) { return allHeaders.indexOf(name); }

    function populateFilters() {
      const roleIdx = colIndex("Role in Entity");
      const facultyIdx = colIndex("Faculty");
      const roles = new Set();
      const faculties = new Set();
      allRows.forEach(row => {
        if (roleIdx > -1 && row[roleIdx]) roles.add(row[roleIdx]);
        if (facultyIdx > -1 && row[facultyIdx]) faculties.add(row[facultyIdx]);
      });
      fillSelect(roleFilter, roles);
      fillSelect(facultyFilter, faculties);
    }

    function fillSelect(selectEl, values) {
      const current = selectEl.value;
      selectEl.innerHTML = selectEl.options[0].outerHTML;
      Array.from(values).sort().forEach(v => {
        const opt = document.createElement("option");
        opt.value = v;
        opt.textContent = v;
        selectEl.appendChild(opt);
      });
      selectEl.value = current;
    }

    function getFilteredRows() {
      const q = searchInput.value.trim().toLowerCase();
      const roleIdx = colIndex("Role in Entity");
      const facultyIdx = colIndex("Faculty");
      const nameIdx = colIndex("Name");
      const nidIdx = colIndex("National ID");
      const emailIdx = colIndex("Email");
      const roleVal = roleFilter.value;
      const facultyVal = facultyFilter.value;

      return allRows.filter(row => {
        if (roleVal && row[roleIdx] !== roleVal) return false;
        if (facultyVal && row[facultyIdx] !== facultyVal) return false;
        if (q) {
          const haystack = [row[nameIdx], row[nidIdx], row[emailIdx]].join(" ").toLowerCase();
          if (!haystack.includes(q)) return false;
        }
        return true;
      });
    }

    function renderStats() {
      const total = allRows.length;
      const roleIdx = colIndex("Role in Entity");
      const hasJobIdx = colIndex("Has Job");
      const workingCount = allRows.filter(r => hasJobIdx > -1 && r[hasJobIdx] === "Yes").length;
      const uniqueRoles = new Set(allRows.map(r => roleIdx > -1 ? r[roleIdx] : "").filter(Boolean)).size;

      statsRow.innerHTML = `
    <div class="stat-card"><div class="num">${total}</div><div class="label">إجمالي المسجلين</div></div>
    <div class="stat-card"><div class="num">${uniqueRoles}</div><div class="label">عدد الصفات المختلفة</div></div>
    <div class="stat-card"><div class="num">${workingCount}</div><div class="label">بيشتغلوا حاليًا</div></div>
  `;
    }

    function renderTable() {
      const rows = getFilteredRows();
      tableHead.innerHTML = allHeaders.map(h => `<th>${h}</th>`).join("");
      if (rows.length === 0) {
        tableBody.innerHTML = "";
        emptyState.style.display = "block";
        return;
      }
      emptyState.style.display = "none";
      tableBody.innerHTML = rows.map(row =>
        "<tr>" + row.map(cell => `<td>${escapeHtml(String(cell ?? ""))}</td>`).join("") + "</tr>"
      ).join("");
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[m]));
    }

    function renderAll() {
      renderStats();
      renderTable();
    }

    searchInput.addEventListener("input", renderTable);
    roleFilter.addEventListener("change", renderTable);
    facultyFilter.addEventListener("change", renderTable);

    document.getElementById("exportBtn").addEventListener("click", () => {
      const rows = getFilteredRows();
      const csvLines = [allHeaders.join(",")];
      rows.forEach(row => {
        csvLines.push(row.map(cell => {
          const v = String(cell ?? "").replace(/"/g, '""');
          return `"${v}"`;
        }).join(","));
      });
      const csvContent = "\uFEFF" + csvLines.join("\n"); // BOM so Excel reads Arabic correctly
      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `dys-registrations-${new Date().toISOString().slice(0, 10)}.csv`;
      link.click();
    });
  </script>
</body>

</html>
